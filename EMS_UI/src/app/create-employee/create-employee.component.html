
<div class="container d-flex justify-content-center mt-5">

  <div class="card p-4 shadow" style="width: 400px;">

    <h2 class="text-center mb-4">Create Employee</h2>

    <form (ngSubmit)="onSubmit()">

      <!-- First Name -->
      <div class="form-group mb-3">

        <label class="mb-1">First Name</label>

        <input type="text" class="form-control" id="firstName" name="firstName" [(ngModel)]="employee.firstName">
      </div>

      <!-- Last Name -->
      <div class="form-group mb-3">

        <label class="mb-1">Last Name</label>

        <input type="text" class="form-control" id="lastName" name="lastName" [(ngModel)]="employee.lastName">

      </div>

      <!-- Salary -->
      <div class="form-group mb-3">

        <label class="mb-1">Salary</label>

        <input type="number" class="form-control" id="salary" name="salary" [(ngModel)]="employee.salary">

      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success w-100">
          Save
        </button>
      </div>

    </form>

  </div>

</div>
